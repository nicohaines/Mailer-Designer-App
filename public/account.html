<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <!-- <div>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="login.html">Account</a>
        </div> -->
    </nav>

    <main class="login-container account-container">
        <img src="images/banner-2.jpg" alt="Banner" class="login-banner">
        <div class="box">
            <h1 class="displayName"></h1>
            <p><strong>Change Password:</strong></p>
            <form id="change-password">
                <input class="fa" id="current-password" type="password" placeholder="Current Password" required>
                <input class="fa" id="new-password" type="password" placeholder="New Password" required>
                <input type="submit" value="Set New Password">
            </form>
            <div id="message"></div>
            <div id="error"></div>
            <a id="logout-button">Logout</a>
        </div>
    </main>

    <script type="module" src="./scripts/user.js"></script>
    <script type="module" src="./scripts/main.js"></script>
</body>
</html>
